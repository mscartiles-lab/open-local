name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the feature and what problem it solves
    validations:
      required: true

  - type: dropdown
    id: artifact
    attributes:
      label: Which artifact does this affect?
      options:
        - Web App (open-local)
        - Mobile App (open-local-mobile)
        - API Server (api-server)
        - All three
        - Not sure / general
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High — blocks a release or causes data loss
        - Medium — important but not blocking
        - Low — nice to have
        - Cosmetic — UI only
    validations:
      required: true

  - type: checkboxes
    id: ops-ready
    attributes:
      label: Ops Readying
      options:
        - label: "Chrissy has been informed and is ready to deploy"
          required: false
